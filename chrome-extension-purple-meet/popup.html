<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SIG Purple - Meet Copilot</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background: #f8fafc;
      color: #0f172a;
    }
    h3 {
      margin: 0 0 4px 0;
      color: #7c3aed;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 11px;
      color: #64748b;
      margin: 0 0 12px 0;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover {
      background: #6d28d9;
    }
    .status {
      font-size: 10px;
      margin-top: 8px;
      text-align: center;
      color: #10b981;
    }
  </style>
</head>
<body>
  <h3>🟣 SIG Purple</h3>
  <p>Copiloto de Google Meet para Briefs BTL en tiempo real.</p>

  <label for="serverUrl">Servidor SIG Purple:</label>
  <input type="text" id="serverUrl" value="https://purple.devlian.de" />

  <label for="meetingId">ID Reunión (opcional / auto):</label>
  <input type="text" id="meetingId" placeholder="Dejar vacío para auto-detectar" />

  <button id="saveBtn">Guardar Conexión</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
